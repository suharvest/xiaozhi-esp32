[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "reachy-mini-xiaozhi-bridge"
version = "0.1.0"
description = "Bridge between Reachy Mini robot and Xiaozhi LLM conversation server"
requires-python = ">=3.10"
dependencies = [
    "reachy-mini",
    "websockets>=12.0",
    "opuslib>=3.0.1",
    "numpy>=1.24",
    "soundfile>=0.12",
    "scipy>=1.11",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
mqtt = [
    "aiomqtt>=2.0",
    "cryptography>=41.0",
]
all = [
    "reachy-mini-xiaozhi-bridge[mqtt]",
]

[project.scripts]
reachy-xiaozhi = "reachy_mini_bridge.main:main"
