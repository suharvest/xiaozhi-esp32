# Xiaozhi Remote Display Server
# Deploy on Raspberry Pi / reComputer for large screen display
#
# Usage:
#   docker compose up -d
#
# Configure via environment variables or .env file:
#   RD_PORT=8765
#   RD_LOCAL_IP=192.168.1.10  (optional override for multi-interface hosts)
#   RD_LOCAL_AUDIO=1  (enable server-side audio, default: browser only)
#   PUID=1000  (user ID for PulseAudio, run `id -u` to check)

services:
  xiaozhi-display:
    image: seeedstudio/xiaozhi-display:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: xiaozhi-display
    restart: unless-stopped

    # Network settings
    # Note: ports mapping is ignored when using host network mode
    network_mode: host  # Allow the ESP32 to reach the reverse WebSocket directly on the LAN

    # Audio device passthrough (for HDMI/speaker output)
    devices:
      - /dev/snd:/dev/snd

    # Share the system audio socket
    volumes:
      # PulseAudio socket (use PUID env var for user ID)
      - /run/user/${PUID:-1000}/pulse:/run/user/${PUID:-1000}/pulse:ro
      # Persistent data volume for config and uploads
      - xiaozhi-display-data:/data
      # Custom assets (optional)
      # - ./custom-emojis:/app/assets/emojis:ro

    # Environment configuration
    environment:
      # Server port (default: 8765)
      - RD_PORT=${RD_PORT:-8765}
      # Optional LAN address advertised to the ESP32 for its reverse WebSocket
      - RD_LOCAL_IP=${RD_LOCAL_IP:-}
      # Enable server-side audio (HDMI/speaker), default: browser only
      - RD_LOCAL_AUDIO=${RD_LOCAL_AUDIO:-0}
      # Display scale factor
      - RD_SCALE=${RD_SCALE:-1.5}
      # PulseAudio server for audio output
      - PULSE_SERVER=unix:/run/user/${PUID:-1000}/pulse/native
      # Timezone
      - TZ=${TZ:-Asia/Shanghai}
      # Persistent data directory for narrate config
      - RD_DATA_DIR=/data

    # Container capabilities
    group_add:
      - audio  # Access to audio devices

    # Logging configuration
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${RD_PORT:-8765}/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  xiaozhi-display-data:
